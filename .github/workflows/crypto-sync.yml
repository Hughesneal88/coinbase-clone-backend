name: Sync CoinGecko Market Data

on:
  schedule:
    # Every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call /crypto/sync
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
        run: |
          if [ -z "$SYNC_URL" ]; then
            echo "SYNC_URL secret is not set. Add it in repo Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi

          curl -fsS -X POST "$SYNC_URL" \
            -H "Accept: application/json" \
            -H "User-Agent: github-actions"
